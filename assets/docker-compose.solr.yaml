# DDev Solr 8 service file: a single SolrCloud node with embedded ZooKeeper.
#
# Pinned to Pantheon Search's Solr 8 version (8.11.4) so local matches
# production. The Solr 9 variant (docker-compose.solr9.yaml) is the same shape.
#
# One node, not a cluster: this used to be a 3-node cluster with an external
# ZooKeeper, from the old ddev-contrib recipe. Search API's collection is one
# shard with one replica, so the other two nodes held nothing and served
# nothing, yet each was a JVM of its own: per project, the cluster cost three
# Solr heaps and a ZooKeeper for the work of one. It also needed health-gated
# startup ordering, because a node booting before the external ZooKeeper
# answered silently never joined. Embedded ZooKeeper starts inside the node, so
# there is no race to order around.
#
# Conventions are unchanged, so settings.local.solr.append and
# `ddev solrcollection` work as before: SolrCloud with basic auth (user solr,
# pass SolrRocks, .ddev/solr/security.json), collection "search", reachable at
# <project>.ddev.site:8983 and as http://solr:8983 from the web container.
#
# To access Solr: the admin interface is at http://<project>.ddev.site:8983.
services:
  solr:
    image: ${SOLR_BASE_IMAGE:-solr:8.11.4}
    container_name: ddev-${DDEV_SITENAME}-solr
    expose:
      - 8983
    # These labels ensure this service is discoverable by ddev.
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    environment:
      SOLR_HOST: ddev-${DDEV_SITENAME}-solr
      SOLR_PORT: 8983
      # The pre-trained OpenNLP models require a much bigger buffer; embedded
      # ZooKeeper runs in this JVM, so it applies there too.
      SOLR_OPTS: -Djute.maxbuffer=50000000
      #SOLR_HEAP: 1g
      # Lets bin/solr commands authenticate once security.json is in place.
      SOLR_AUTH_TYPE: basic
      SOLR_AUTHENTICATION_OPTS: -Dbasicauth=solr:SolrRocks
      VIRTUAL_HOST: ${DDEV_HOSTNAME}
      HTTP_EXPOSE: 8983:8983
    volumes:
      - .:/mnt/ddev_config
      - solr:/var/solr
    # Start once to upload security.json into the embedded ZooKeeper, then run
    # in the foreground. The ZooKeeper data lives in the volume, so the upload
    # just refreshes it on later starts.
    command:
      - bash
      - -c
      - |
        set -eu -o pipefail
        docker-entrypoint.sh solr start -c
        solr zk cp file:/mnt/ddev_config/solr/security.json zk:/security.json -z localhost:9983
        solr stop > /dev/null
        exec solr-foreground -c
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u solr:SolrRocks http://localhost:8983/api/cluster/nodes || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  # Links Solr into the web container as the short host `solr`, so
  # http://solr:8983 resolves there. Drupal itself connects via
  # <project>.ddev.site:8983 (see settings.local.solr.append).
  web:
    links:
      - solr:solr

volumes:
  solr:
