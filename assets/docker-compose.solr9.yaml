# Source: https://github.com/ddev/ddev-solr (official DDEV Solr add-on).
#
# Solr 9 variant of the ddev-drupal Solr service. Selected by the "Solr version"
# ddev-setup prompt (8 -> docker-compose.solr.yaml, 9 -> this file); the chosen
# file is stamped to .ddev/docker-compose.solr.yaml.
#
# Like the Solr 8 build, Solr 9 runs a single cloud node with EMBEDDED
# ZooKeeper (localhost:9983). Two Solr-9-only
# requirements are handled here: SOLR_MODULES must explicitly list the analyzers
# Search API Solr needs (Solr 9 no longer auto-loads contrib modules), and basic
# auth is bootstrapped via SOLR_AUTH_TYPE / SOLR_AUTHENTICATION_OPTS.
#
# Conventions kept identical to the 8 file so settings.local.solr.append and the
# `ddev solrcollection` command work unchanged: user solr / pass SolrRocks,
# .ddev/solr/security.json, core "search", reachable at <project>.ddev.site:8983.
#
# The image is pinned to Pantheon Search's Solr 9 version (9.10.1), NOT the
# floating `solr:9` tag, so local matches production exactly — bump this in step
# with Pantheon when they advance their Solr 9 build. SOLR_BASE_IMAGE still lets
# a project override for a one-off. (The 8 variant likewise pins 8.11.4.)
#
# The `#ddev-generated` marker from the upstream file is intentionally removed:
# this is a committed project file we manage, not one ddev may overwrite.
services:
  solr:
    image: ${SOLR_BASE_IMAGE:-solr:9.10.1}-${DDEV_SITENAME}-built
    build:
      dockerfile_inline: |
        ARG SOLR_BASE_IMAGE="scratch"
        FROM $$SOLR_BASE_IMAGE
        # Fix HTTPS redirect to HTTP which breaks URL for Solr Admin UI.
        # The reason for this problem is that Solr uses Jetty as a webserver.
        # Jetty has X-Forwarded- headers disabled by default, enable them here:
        USER root
        RUN sed -i '/X-Forwarded-/,/-->/ {/<!--/d; /-->/d}' /opt/solr/server/etc/jetty.xml
        # Use predefined values for username/password in Solr Admin UI.
        RUN sed -i "/\$$rootScope.exceptions = {};/a \$$scope.username = 'solr'; \$$scope.password = 'SolrRocks';" /opt/solr/server/solr-webapp/webapp/js/angular/controllers/login.js
        USER solr
      args:
        SOLR_BASE_IMAGE: ${SOLR_BASE_IMAGE:-solr:9.10.1}
    container_name: ddev-${DDEV_SITENAME}-solr
    expose:
      - 8983
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    environment:
      SOLR_HOST: ddev-${DDEV_SITENAME}-solr
      SOLR_PORT: 8983
      # The pre-trained OpenNLP models require a much bigger buffer.
      SOLR_OPTS: -Djute.maxbuffer=50000000
      #SOLR_HEAP: 1g
      SOLR_AUTH_TYPE: basic
      SOLR_AUTHENTICATION_OPTS: -Dbasicauth=solr:SolrRocks
      # needed for Drupal Search API Solr
      SOLR_MODULES: ${SOLR_MODULES-extraction,langid,ltr,analysis-extras}
      VIRTUAL_HOST: ${DDEV_HOSTNAME}
      HTTP_EXPOSE: 8983:8983
      HTTPS_EXPOSE: 8943:8983
    volumes:
      - .:/mnt/ddev_config
      - ddev-global-cache:/mnt/ddev-global-cache
      - ./solr/lib:/opt/solr/modules/ddev/lib
      - solr:/var/solr
    command:
      - bash
      - -c
      - |
        set -eu -o pipefail
        docker-entrypoint.sh solr start -c -Dlog4j.configurationFile=/opt/solr/server/resources/log4j2-console.xml
        solr zk cp file:/mnt/ddev_config/solr/security.json zk:/security.json -z localhost:9983
        cd /mnt/ddev_config/solr/configsets
        for dir in */; do
          dir="$${dir%/}"
          if [[ "$$dir" != "*" ]]; then
            echo "uploading configset $$dir"
            solr zk upconfig -n "$$dir" -d "$$dir" -z localhost:9983
            echo "creating collection $$dir"
            solr create -c "$$dir" -n "$$dir" -shards 1 -replicationFactor 1 || true
          fi
        done
        cd -
        solr stop > /dev/null
        exec solr-foreground -c -Dlog4j.configurationFile=/opt/solr/server/resources/log4j2.xml
    healthcheck:
      test: ["CMD-SHELL", "curl --fail -s localhost:8983/solr/"]
    x-ddev:
      describe-info: |
        User: solr
        Pass: SolrRocks
        Image: ${SOLR_BASE_IMAGE:-solr:9.10.1}
      ssh-shell: bash

  # Link the Solr service into the web container as the short host `solr`, so
  # `http://solr:8983` resolves there (parity with the 8 file). Drupal itself
  # connects via <project>.ddev.site:8983 (see settings.local.solr.append).
  web:
    links:
      - solr:solr

volumes:
  solr:
